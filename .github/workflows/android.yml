name: Android Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Roaring Knight sprite pack
        run: |
          python3 -m pip install --quiet pillow
          mkdir -p /tmp/knight-pack app/src/main/assets/roaring_knight
          unzip -oq Deltaruined_Roaring_Knight_Full_Spritepack.zip -d /tmp/knight-pack
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import shutil, json, re
          source = Path("/tmp/knight-pack")
          target = Path("app/src/main/assets/roaring_knight")
          target.mkdir(parents=True, exist_ok=True)
          for old in target.glob("*.png"):
              old.unlink()
          files = sorted((p for p in source.rglob("*") if p.is_file() and p.suffix.lower() == ".png"), key=lambda p: str(p).lower())
          if not files:
              raise SystemExit("Sprite ZIP contains no PNG files")
          # Preserve numbered frames; uploaded contact sheets allow visual verification.
          # Semantic ranges are provisional until each frame is reviewed.
          ranges = [
              (1,23,"knight"), (24,35,"effect"), (36,67,"attack"), (68,74,"slash"),
              (75,90,"knight"), (91,108,"attack"), (109,125,"magic"), (126,156,"idle"),
              (157,165,"effect"), (166,218,"idle"), (219,234,"attack"), (235,239,"magic"),
              (240,254,"knight"), (255,265,"slash"), (266,274,"duel"), (275,297,"effect"),
              (298,302,"projectile"), (303,306,"background"), (307,326,"effect"),
              (327,333,"particle"), (334,366,"attack"), (367,374,"magic"), (375,388,"idle"),
              (389,412,"effect"), (413,420,"magic"), (421,446,"projectile"), (447,454,"effect"),
              (455,472,"slash"), (473,480,"effect"), (481,485,"ui")
          ]
          groups, index = {}, []
          for ordinal, path in enumerate(files, 1):
              match = re.search(r"(\\d+)$", path.stem)
              number = int(match.group(1)) if match else ordinal
              category = next((name for first,last,name in ranges if first <= number <= last), "misc")
              name = f"{category}_{number:03d}.png"
              shutil.copy2(path, target / name)
              groups.setdefault(category, []).append(name)
              index.append({"file":name,"category":category,"source":str(path.relative_to(source)),"original_number":number})
          (target / "index.json").write_text(json.dumps(index, indent=2))
          sheets = Path("sprite-contact-sheets")
          sheets.mkdir(exist_ok=True)
          cell_w, cell_h, cols, batch = 180, 150, 5, 40
          for start in range(0, len(files), batch):
              subset = files[start:start+batch]
              rows = (len(subset) + cols - 1) // cols
              sheet = Image.new("RGB", (cols*cell_w, rows*cell_h), (18,18,25))
              draw = ImageDraw.Draw(sheet)
              for j, path in enumerate(subset):
                  try:
                      with Image.open(path) as im:
                          im.thumbnail((cell_w-12, cell_h-30))
                          x=(j%cols)*cell_w+(cell_w-im.width)//2
                          y=(j//cols)*cell_h+4
                          rgba=im.convert("RGBA")
                          sheet.paste(rgba, (x,y), rgba)
                          draw.text(((j%cols)*cell_w+6,(j//cols)*cell_h+cell_h-20), path.name, fill=(255,230,120))
                  except Exception:
                      draw.text(((j%cols)*cell_w+6,(j//cols)*cell_h+8), f"ERROR {path.name}", fill=(255,80,80))
              sheet.save(sheets / f"sheet_{start+1:03d}_{start+len(subset):03d}.jpg", quality=92)
          print(f"Generated {((len(files)+batch-1)//batch)} visual contact sheets")
          print(f"Renamed and extracted {len(files)} PNG files")
          print("Groups: " + ", ".join(f"{k}={len(v)}" for k,v in sorted(groups.items())))
          if len(files) != 485:
              print(f"NOTE: expected 485 reviewed frames; archive contains {len(files)}")
          PY
      - name: Upload sprite contact sheets
        uses: actions/upload-artifact@v4
        with:
          name: roaring-knight-sprite-contact-sheets
          path: sprite-contact-sheets/*.jpg
          retention-days: 14

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: deltaruined-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build release APK on published release
        if: github.event_name == 'release'
        run: gradle --no-daemon assembleRelease

      - name: Upload release APK
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: deltaruined-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
